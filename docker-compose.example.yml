# Example: develop from this repo (build + bind mount). Copy to docker-compose.yml and adjust secrets.
#
# For the published image from Docker Hub (no build, no mount), use docker-compose.hub.example.yml
# and paste that on Hub — it adds DATADOCK_DB_* on web.
#
# After containers are up, complete setup via install.php in a browser or scripts/datadock-install.php.
# This file bind-mounts the source tree, so install.php stays in the project directory until you delete it.
# The published image (docker-compose.hub.example.yml) removes install.php itself and keeps settings
# and uploads in the datadock_data volume across compose down/up and --force-recreate.
#
# Optional runtime overrides (see includes/settings_loader.php):
#   DATADOCK_READ_ONLY=1
#   DATADOCK_SITE_NAME=My Archive
#   DATADOCK_STORAGE_BASE_PATH=/var/www/html
#   DATADOCK_SECURITY_HEADERS=recommended   # off | recommended | strict (v2.5+)

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APACHE_RUN_USER: www-data
      # This compose file bind-mounts the source tree. Do not relocate settings or delete install.php.
      DATADOCK_IMAGE_MODE: "0"
      # TCP to the db service (avoid "localhost" → Unix socket in the web container).
      DATADOCK_DB_HOST: db
      DATADOCK_DB_NAME: datadock
      DATADOCK_DB_USER: datadock
      DATADOCK_DB_PASSWORD: changeme_app
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: changeme_root
      MYSQL_DATABASE: datadock
      MYSQL_USER: datadock
      MYSQL_PASSWORD: changeme_app
    volumes:
      - datadock_mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  datadock_mysql:
